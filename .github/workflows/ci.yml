name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  windows:
    name: Windows build
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Wails CLI
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Check frontend
        shell: pwsh
        run: |
          node --check cmd/frp-client-desktop/frontend/app.js
          node scripts/check-frontend.mjs

      - name: Test
        shell: pwsh
        run: go test ./...

      - name: Vet
        shell: pwsh
        run: go vet ./...

      - name: Build production EXE
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item cmd/frp-client-desktop/build/bin/frp-client-manager.exe dist/frp-client-manager-windows-amd64.exe
          (Get-FileHash dist/frp-client-manager-windows-amd64.exe -Algorithm SHA256).Hash.ToLower() + "  frp-client-manager-windows-amd64.exe" | Set-Content -NoNewline dist/frp-client-manager-windows-amd64.exe.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: frp-client-manager-windows-amd64
          path: |
            dist/frp-client-manager-windows-amd64.exe
            dist/frp-client-manager-windows-amd64.exe.sha256
          if-no-files-found: error
