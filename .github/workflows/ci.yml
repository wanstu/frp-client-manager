name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  desktop:
    uses: wanstu/wails-desktop-kit/.github/workflows/wails-desktop.yml@b3145064740ca37c277b5347dba6a095256b46f6
    with:
      app-name: frp-client-manager
      desktop-dir: cmd/frp-client-desktop
      test-command: ""
      vet-command: ""
      build-command-windows: ./scripts/build.ps1
      build-command-unix: bash ./scripts/build.sh
