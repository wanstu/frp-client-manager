name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    uses: wanstu/wails-desktop-kit/.github/workflows/wails-desktop.yml@v0.8.0
    with:
      app-name: frp-client-manager
      desktop-dir: cmd/frp-client-desktop
      test-command: ""
      vet-command: ""
      build-command-windows: ./scripts/build.ps1
      build-command-unix: bash ./scripts/build.sh
      linux-package-formats: raw,deb
      linux-package-description: "FRP Client Manager desktop application"
      linux-desktop-file: packaging/frp-client-manager.desktop
      linux-icon-file: packaging/frp-client-manager.png
      post-package-command-linux: bash ./scripts/verify-linux-package.sh
      publish-release: true
